<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #101828;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
      }
      .subtitle {
        font-size: 16px;
        fill: #475467;
      }
      .entity-text {
        font-size: 20px;
        font-weight: 700;
      }
      .attr-text {
        font-size: 16px;
      }
      .rel-text {
        font-size: 15px;
        font-weight: 700;
      }
      .cardinality {
        font-size: 20px;
        font-weight: 700;
        fill: #1247a5;
      }
      .pk {
        text-decoration: underline;
      }
      .connector {
        stroke: #202124;
        stroke-width: 2.1;
        fill: none;
      }
      .entity-blue {
        fill: #eaf2ff;
        stroke: #2f65b0;
        stroke-width: 3;
      }
      .entity-green {
        fill: #eaf7e8;
        stroke: #277a31;
        stroke-width: 3;
      }
      .entity-yellow {
        fill: #fff4cc;
        stroke: #b88a00;
        stroke-width: 3;
      }
      .entity-purple {
        fill: #efe8ff;
        stroke: #6f3fa3;
        stroke-width: 3;
      }
      .attribute-blue {
        fill: #ffffff;
        stroke: #2f65b0;
        stroke-width: 2;
      }
      .attribute-green {
        fill: #ffffff;
        stroke: #277a31;
        stroke-width: 2;
      }
      .attribute-yellow {
        fill: #ffffff;
        stroke: #b88a00;
        stroke-width: 2;
      }
      .attribute-purple {
        fill: #ffffff;
        stroke: #6f3fa3;
        stroke-width: 2;
      }
      .relationship {
        fill: #fff8dc;
        stroke: #202124;
        stroke-width: 2.2;
      }
      .note {
        fill: #f9fafb;
        stroke: #d0d5dd;
        stroke-width: 1.6;
      }
      .note-text {
        fill: #475467;
        font-size: 15px;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>

  <text class="title" x="900" y="54" text-anchor="middle">Entity Relationship Diagram - Academic Pathway Recommender</text>
  <text class="subtitle" x="900" y="84" text-anchor="middle">Organized Chen-style ERD with aligned entities, clear relationships, primary keys, and cardinality labels</text>

  <!-- Relationship connectors: clean main structure. -->
  <line class="connector" x1="390" y1="465" x2="475" y2="465"/>
  <line class="connector" x1="635" y1="465" x2="720" y2="465"/>
  <line class="connector" x1="1030" y1="465" x2="1100" y2="465"/>
  <line class="connector" x1="1260" y1="465" x2="1330" y2="465"/>
  <line class="connector" x1="875" y1="510" x2="875" y2="595"/>
  <line class="connector" x1="875" y1="695" x2="875" y2="780"/>
  <line class="connector" x1="1030" y1="825" x2="1100" y2="825"/>
  <polyline class="connector" points="1260,825 1465,825 1465,510"/>

  <!-- Relationship diamonds. -->
  <polygon class="relationship" points="555,415 635,465 555,515 475,465"/>
  <text class="rel-text" x="555" y="471" text-anchor="middle">TRANSFORMS</text>
  <text class="cardinality" x="420" y="453" text-anchor="middle">1</text>
  <text class="cardinality" x="690" y="453" text-anchor="middle">1</text>

  <polygon class="relationship" points="1180,415 1260,465 1180,515 1100,465"/>
  <text class="rel-text" x="1180" y="471" text-anchor="middle">TRAINS</text>
  <text class="cardinality" x="1070" y="453" text-anchor="middle">N</text>
  <text class="cardinality" x="1292" y="453" text-anchor="middle">1</text>

  <polygon class="relationship" points="875,595 955,645 875,695 795,645"/>
  <text class="rel-text" x="875" y="651" text-anchor="middle">COMPUTES</text>
  <text class="cardinality" x="900" y="552" text-anchor="middle">1</text>
  <text class="cardinality" x="900" y="750" text-anchor="middle">1</text>

  <polygon class="relationship" points="1180,775 1260,825 1180,875 1100,825"/>
  <text class="rel-text" x="1180" y="831" text-anchor="middle">USES</text>
  <text class="cardinality" x="1065" y="813" text-anchor="middle">N</text>
  <text class="cardinality" x="1488" y="650" text-anchor="middle">1</text>

  <!-- Student Survey Record attribute connectors. -->
  <line class="connector" x1="255" y1="420" x2="155" y2="290"/>
  <line class="connector" x1="255" y1="420" x2="330" y2="292"/>
  <line class="connector" x1="120" y1="445" x2="92" y2="395"/>
  <line class="connector" x1="120" y1="465" x2="78" y2="490"/>
  <line class="connector" x1="120" y1="490" x2="130" y2="600"/>
  <line class="connector" x1="255" y1="510" x2="258" y2="635"/>
  <line class="connector" x1="350" y1="510" x2="385" y2="602"/>
  <line class="connector" x1="390" y1="425" x2="433" y2="355"/>
  <line class="connector" x1="390" y1="505" x2="440" y2="535"/>

