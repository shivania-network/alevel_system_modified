  <text class="attr-text" x="635" y="605" text-anchor="middle">language_score</text>

  <ellipse class="attribute-green" cx="620" cy="685" rx="88" ry="27"/>
  <text class="attr-text" x="620" y="690" text-anchor="middle">tech_score</text>

  <ellipse class="attribute-green" cx="1130" cy="685" rx="120" ry="27"/>
  <text class="attr-text" x="1130" y="690" text-anchor="middle">commerce_score</text>

  <ellipse class="attribute-green" cx="1120" cy="620" rx="92" ry="27"/>
  <text class="attr-text" x="1120" y="625" text-anchor="middle">overall_avg</text>

