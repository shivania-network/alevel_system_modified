  <line class="connector" x1="720" y1="812" x2="560" y2="804"/>
  <line class="connector" x1="720" y1="852" x2="640" y2="950"/>
  <line class="connector" x1="815" y1="870" x2="800" y2="1010"/>
  <line class="connector" x1="930" y1="870" x2="1010" y2="1010"/>
  <line class="connector" x1="1030" y1="852" x2="1120" y2="950"/>
  <line class="connector" x1="1030" y1="800" x2="1125" y2="735"/>

  <!-- Student Survey Record attributes. -->
  <ellipse class="attribute-blue" cx="155" cy="270" rx="94" ry="27"/>
  <text class="attr-text pk" x="155" y="275" text-anchor="middle">record_id (PK)</text>

  <ellipse class="attribute-blue" cx="330" cy="270" rx="62" ry="25"/>
  <text class="attr-text" x="330" y="276" text-anchor="middle">name</text>

  <ellipse class="attribute-blue" cx="92" cy="375" rx="70" ry="25"/>
  <text class="attr-text" x="92" y="381" text-anchor="middle">gender</text>

  <ellipse class="attribute-blue" cx="78" cy="490" rx="78" ry="25"/>
  <text class="attr-text" x="78" y="496" text-anchor="middle">student_id</text>

  <ellipse class="attribute-blue" cx="130" cy="625" rx="126" ry="27"/>
  <text class="attr-text" x="130" y="630" text-anchor="middle">O-Level grades</text>

  <ellipse class="attribute-blue" cx="258" cy="660" rx="116" ry="27"/>
  <text class="attr-text" x="258" y="665" text-anchor="middle">academic_wish</text>

  <ellipse class="attribute-blue" cx="385" cy="625" rx="105" ry="27"/>
  <text class="attr-text" x="385" y="630" text-anchor="middle">career_interest</text>

  <ellipse class="attribute-blue" cx="433" cy="333" rx="118" ry="27"/>
  <text class="attr-text" x="433" y="338" text-anchor="middle">labor_market_view</text>

  <ellipse class="attribute-blue" cx="440" cy="535" rx="66" ry="25"/>
