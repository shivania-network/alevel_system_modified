  <rect class="entity-green" x="720" y="420" width="310" height="90" rx="7"/>
  <text class="entity-text" x="875" y="458" text-anchor="middle">ENGINEERED</text>
  <text class="entity-text" x="875" y="484" text-anchor="middle">FEATURE SET</text>

  <!-- Model Artifact attributes. -->
  <ellipse class="attribute-yellow" cx="1280" cy="270" rx="120" ry="27"/>
  <text class="attr-text" x="1280" y="275" text-anchor="middle">feature_columns</text>

  <ellipse class="attribute-yellow" cx="1495" cy="270" rx="88" ry="27"/>
  <text class="attr-text pk" x="1495" y="275" text-anchor="middle">model_id (PK)</text>

  <ellipse class="attribute-yellow" cx="1635" cy="340" rx="122" ry="27"/>
  <text class="attr-text" x="1635" y="345" text-anchor="middle">algorithm_name</text>

  <ellipse class="attribute-yellow" cx="1692" cy="438" rx="78" ry="25"/>
  <text class="attr-text" x="1692" y="444" text-anchor="middle">model_file</text>

  <ellipse class="attribute-yellow" cx="1692" cy="510" rx="78" ry="25"/>
  <text class="attr-text" x="1692" y="516" text-anchor="middle">scaler_file</text>

  <ellipse class="attribute-yellow" cx="1605" cy="625" rx="88" ry="25"/>
  <text class="attr-text" x="1605" y="631" text-anchor="middle">encoder_file</text>

  <ellipse class="attribute-yellow" cx="1420" cy="660" rx="106" ry="27"/>
  <text class="attr-text" x="1420" y="665" text-anchor="middle">accuracy_score</text>

  <!-- Model Artifact entity. -->
  <rect class="entity-yellow" x="1330" y="420" width="270" height="90" rx="7"/>
  <text class="entity-text" x="1465" y="458" text-anchor="middle">MODEL</text>
  <text class="entity-text" x="1465" y="484" text-anchor="middle">ARTIFACT</text>

  <!-- Prediction Session attributes. -->
  <ellipse class="attribute-purple" cx="560" cy="804" rx="118" ry="27"/>
  <text class="attr-text" x="560" y="809" text-anchor="middle">input_grade_set</text>

  <ellipse class="attribute-purple" cx="640" cy="975" rx="92" ry="27"/>
  <text class="attr-text pk" x="640" y="980" text-anchor="middle">session_id (PK)</text>

  <ellipse class="attribute-purple" cx="800" cy="1035" rx="116" ry="27"/>
  <text class="attr-text" x="800" y="1040" text-anchor="middle">storage_policy</text>

  <ellipse class="attribute-purple" cx="1010" cy="1035" rx="92" ry="27"/>
  <text class="attr-text" x="1010" y="1040" text-anchor="middle">generated_at</text>

  <ellipse class="attribute-purple" cx="1120" cy="975" rx="116" ry="27"/>
  <text class="attr-text" x="1120" y="980" text-anchor="middle">confidence_score</text>

  <ellipse class="attribute-purple" cx="1125" cy="735" rx="126" ry="27"/>
  <text class="attr-text" x="1125" y="740" text-anchor="middle">predicted_pathway</text>

  <!-- Prediction Session entity. -->
  <rect class="entity-purple" x="720" y="780" width="310" height="90" rx="7"/>
  <text class="entity-text" x="875" y="818" text-anchor="middle">PREDICTION</text>
  <text class="entity-text" x="875" y="844" text-anchor="middle">SESSION</text>

  <!-- Temporary storage note. -->
  <rect class="note" x="70" y="930" width="410" height="105" rx="8"/>
  <text class="note-text" x="275" y="963" text-anchor="middle">No permanent student account table is required.</text>
  <text class="note-text" x="275" y="987" text-anchor="middle">Uploaded report cards are processed temporarily</text>
  <text class="note-text" x="275" y="1011" text-anchor="middle">and deleted after OCR/recommendation processing.</text>
</svg>
