  <line class="connector" x1="790" y1="420" x2="760" y2="290"/>
  <line class="connector" x1="950" y1="420" x2="965" y2="290"/>
  <line class="connector" x1="720" y1="430" x2="675" y2="355"/>
  <line class="connector" x1="1030" y1="430" x2="1090" y2="355"/>
  <line class="connector" x1="720" y1="500" x2="635" y2="600"/>
  <line class="connector" x1="790" y1="510" x2="620" y2="685"/>
  <line class="connector" x1="970" y1="510" x2="1130" y2="685"/>
  <line class="connector" x1="1030" y1="500" x2="1120" y2="595"/>

  <!-- Model Artifact attribute connectors. -->
  <line class="connector" x1="1385" y1="420" x2="1280" y2="292"/>
  <line class="connector" x1="1465" y1="420" x2="1495" y2="292"/>
  <line class="connector" x1="1535" y1="420" x2="1635" y2="340"/>
  <line class="connector" x1="1600" y1="452" x2="1692" y2="438"/>
  <line class="connector" x1="1600" y1="478" x2="1692" y2="510"/>
  <line class="connector" x1="1535" y1="510" x2="1605" y2="603"/>
  <line class="connector" x1="1465" y1="510" x2="1420" y2="635"/>

