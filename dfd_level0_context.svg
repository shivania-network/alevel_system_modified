<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#202124"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #101828;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        font-size: 17px;
        font-weight: 600;
      }
      .entity {
        fill: #eaf4ff;
        stroke: #2f65b0;
        stroke-width: 3;
        rx: 5;
      }
      .process {
        fill: #e8f5e9;
        stroke: #2f7d32;
        stroke-width: 3;
        rx: 26;
      }
      .external {
        fill: #fff7e6;
        stroke: #d18a00;
        stroke-width: 3;
        rx: 5;
      }
      .entity-label {
        fill: #174a7c;
        font-size: 17px;
        font-weight: 700;
      }
      .process-label {
        fill: #2f6f36;
        font-size: 18px;
        font-weight: 700;
      }
      .body {
        font-size: 13px;
      }
      .flow {
        stroke: #202124;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrow);
      }
      .label-bg {
        fill: #ffffff;
        stroke: #d0d5dd;
        stroke-width: 1;
        rx: 3;
      }
      .flow-label {
        font-size: 13px;
        font-weight: 600;
        fill: #344054;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text class="title" x="600" y="48" text-anchor="middle">DFD LEVEL 0</text>
  <text class="subtitle" x="600" y="78" text-anchor="middle">Academic Pathway Recommendation System</text>

  <!-- External entities -->
  <rect class="entity" x="70" y="165" width="170" height="82"/>
  <text class="entity-label" x="155" y="213" text-anchor="middle">STUDENT</text>

  <rect class="entity" x="70" y="440" width="170" height="88"/>
  <text class="entity-label" x="155" y="475" text-anchor="middle">TEACHER /</text>
  <text class="entity-label" x="155" y="500" text-anchor="middle">GUIDANCE STAFF</text>

  <rect class="entity" x="965" y="170" width="175" height="88"/>
  <text class="entity-label" x="1052.5" y="205" text-anchor="middle">PARENT /</text>
  <text class="entity-label" x="1052.5" y="230" text-anchor="middle">GUARDIAN</text>

  <rect class="external" x="505" y="525" width="190" height="78"/>
  <text class="entity-label" x="600" y="558" text-anchor="middle">EMAIL</text>
  <text class="entity-label" x="600" y="582" text-anchor="middle">SERVICE</text>

  <!-- Main system -->
  <rect class="process" x="420" y="210" width="360" height="185"/>
  <text class="process-label" x="600" y="244" text-anchor="middle">0</text>
  <text class="process-label" x="600" y="272" text-anchor="middle">Academic Pathway</text>
  <text class="process-label" x="600" y="297" text-anchor="middle">Recommendation System</text>
  <text class="body" x="600" y="330" text-anchor="middle">Processes student information and uploaded report cards,</text>
  <text class="body" x="600" y="350" text-anchor="middle">predicts the suitable pathway, prepares the result,</text>
  <text class="body" x="600" y="370" text-anchor="middle">and sends guardian notification.</text>

  <!-- Student to system flows: labels follow right-pointing connections. -->
  <path class="flow" d="M240 185 H420"/>
  <rect class="label-bg" x="260" y="160" width="135" height="24"/>
  <text class="flow-label" x="327.5" y="176" text-anchor="middle">Student details</text>

  <path class="flow" d="M240 210 H330 V250 H420"/>
  <rect class="label-bg" x="260" y="222" width="142" height="24"/>
  <text class="flow-label" x="331" y="238" text-anchor="middle">Grades / interests</text>

  <path class="flow" d="M240 235 H310 V290 H420"/>
  <rect class="label-bg" x="260" y="282" width="150" height="24"/>
  <text class="flow-label" x="335" y="298" text-anchor="middle">Report-card upload</text>

  <!-- System to student flow: separate left-pointing return line. -->
  <path class="flow" d="M420 335 H330 V255 H240"/>
  <rect class="label-bg" x="252" y="320" width="154" height="24"/>
  <text class="flow-label" x="329" y="336" text-anchor="middle">Ranked result</text>

  <!-- Teacher flows. -->
  <path class="flow" d="M240 465 H350 V365 H420"/>
  <rect class="label-bg" x="260" y="440" width="148" height="24"/>
  <text class="flow-label" x="334" y="456" text-anchor="middle">Corrections / uploads</text>

  <path class="flow" d="M420 375 H370 V500 H240"/>
  <rect class="label-bg" x="260" y="500" width="138" height="24"/>
  <text class="flow-label" x="329" y="516" text-anchor="middle">Guidance report</text>

  <!-- Parent and email flows. -->
  <path class="flow" d="M780 250 H965"/>
  <rect class="label-bg" x="820" y="225" width="118" height="24"/>
  <text class="flow-label" x="879" y="241" text-anchor="middle">Result notice</text>

  <path class="flow" d="M600 395 V525"/>
  <rect class="label-bg" x="622" y="452" width="138" height="24"/>
  <text class="flow-label" x="691" y="468" text-anchor="middle">Email request</text>

  <path class="flow" d="M695 564 H875 V214 H965"/>
  <rect class="label-bg" x="735" y="538" width="158" height="24"/>
  <text class="flow-label" x="814" y="554" text-anchor="middle">Notification sent</text>
</svg>
