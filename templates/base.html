<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}A-Level Pathway Recommender{% endblock %} | G.S NYAKINAMA I TSS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary:      #1e3a5f;
      --primary-dark: #152d4a;
      --primary-light:#2d5a8e;
      --accent:       #f59e0b;
      --accent-dark:  #d97706;
      --success:      #16a34a;
      --danger:       #dc2626;
      --warning:      #d97706;
      --info:         #0284c7;
      --light:        #f0f4f8;
      --border:       #e2e8f0;
      --text:         #1e293b;
      --text-muted:   #64748b;
      --radius:       12px;
      --shadow:       0 2px 16px rgba(0,0,0,.08);
      --shadow-lg:    0 8px 32px rgba(0,0,0,.12);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: var(--text);
      font-size: .95rem;
    }

    /* ── Navbar ─────────────────────────────────────────────── */
    .navbar {
      background: var(--primary) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      padding: 0 0;
    }
    .navbar-brand {
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff !important;
      letter-spacing: -.3px;
      padding: 14px 0;
    }
    .navbar-brand .brand-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-right: 10px;
      color: var(--primary);
      font-size: .9rem;
    }
    .nav-link {
      color: rgba(255,255,255,.8) !important;
      font-size: .88rem;
      font-weight: 500;
      padding: 18px 14px !important;
      border-bottom: 3px solid transparent;
      transition: all .2s;
    }
    .nav-link:hover  { color: #fff !important; border-bottom-color: rgba(255,255,255,.4); }
    .nav-link.active { color: var(--accent) !important; border-bottom-color: var(--accent); }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 56px 0 48px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .hero h1 { font-size: 2.1rem; font-weight: 800; line-height: 1.2; }
    .hero p  { font-size: 1rem; opacity: .88; line-height: 1.6; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-weight: 600; border-radius: 50px;
      padding: 5px 14px; font-size: .78rem;
      margin-bottom: 16px;
      backdrop-filter: blur(4px);
    }

    /* ── Cards ──────────────────────────────────────────────── */
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: #fff;
    }
    .card-header-primary {
      background: var(--primary);
      color: white;
      border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
      padding: 16px 22px;
    }
    .card-header-primary h4,
    .card-header-primary h5 { margin: 0; font-weight: 700; }

    /* ── Form controls ──────────────────────────────────────── */
    .form-control, .form-select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      padding: 9px 12px;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,58,95,.1);
      outline: none;
    }
    .form-label {
      font-weight: 600;
      font-size: .83rem;
      color: #374151;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      font-weight: 600;
      border-radius: 8px;
      font-size: .9rem;
      padding: 9px 20px;
      transition: all .2s;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30,58,95,.3);
    }
    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--primary);
    }
    .btn-accent:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .btn-outline-primary { border-color: var(--primary); color: var(--primary); }
    .btn-outline-primary:hover { background: var(--primary); color: #fff; }

    /* ── Result cards ───────────────────────────────────────── */
    .result-card {
      border-left: 4px solid;
      border-radius: var(--radius);
      transition: transform .2s, box-shadow .2s;
    }
    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .rank-badge {
      width: 36px; height: 36px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .95rem; color: white;
      flex-shrink: 0;
    }
    .prob-bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
    .prob-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }

    /* ── Step circles ───────────────────────────────────────── */
    .step-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary);
      color: white;
      font-weight: 800; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }

    /* ── Stat boxes ─────────────────────────────────────────── */
    .stat-box {
      border-radius: var(--radius);
      padding: 22px;
      background: white;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .stat-box .number { font-size: 2.2rem; font-weight: 800; }
    .stat-box .label  { font-size: .82rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Section divider ────────────────────────────────────── */
    .section-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 10;
      background: var(--primary) !important;
      color: rgba(255,255,255,.65);
      font-size: .8rem;
      padding: 28px 0;
      margin-top: 0;
      border-top: 3px solid var(--accent);
    }
    footer strong { color: rgba(255,255,255,.9); }
    footer a { color: var(--accent); text-decoration: none; }

    /* ── Custom Modal ───────────────────────────────────────── */
    .kiro-modal-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(15,23,42,.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .25s;
      pointer-events: none;
    }
    .kiro-modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    .kiro-modal {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.22);
      max-width: 460px;
      width: calc(100% - 32px);
      transform: scale(.94) translateY(8px);
      transition: transform .25s;
    }
    .kiro-modal-overlay.show .kiro-modal {
      transform: scale(1) translateY(0);
    }
    .kiro-modal-header {
      padding: 20px 24px 0;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .kiro-modal-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .kiro-modal-icon.warning { background: #fef3c7; color: #d97706; }
    .kiro-modal-icon.danger  { background: #fee2e2; color: #dc2626; }
    .kiro-modal-icon.success { background: #dcfce7; color: #16a34a; }
    .kiro-modal-icon.info    { background: #e0f2fe; color: #0284c7; }
    .kiro-modal-title { font-weight: 700; font-size: 1rem; color: var(--text); margin: 0 0 4px; }
    .kiro-modal-body  { padding: 12px 24px 20px 82px; color: var(--text-muted); font-size: .9rem; line-height: 1.6; }
    .kiro-modal-list  { margin: 8px 0 0; padding-left: 16px; }
    .kiro-modal-list li { margin-bottom: 3px; }
    .kiro-modal-footer {
      padding: 0 24px 20px 24px;
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .kiro-modal-footer .btn { min-width: 80px; }

    /* ── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <span class="brand-icon"><i class="fas fa-graduation-cap"></i></span>
      A-Level Pathway Recommender
    </a>
    <button class="navbar-toggler border-0 text-white" type="button"
            data-bs-toggle="collapse" data-bs-target="#nav">
      <i class="fas fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="/">
            <i class="fas fa-house me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='grades' %}active{% endif %}" href="/grades">
            <i class="fas fa-pen-to-square me-1"></i>Enter Grades
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['upload','upload_process'] %}active{% endif %}" href="/upload">
            <i class="fas fa-file-arrow-up me-1"></i>Upload Reports
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='about' %}active{% endif %}" href="/about">
            <i class="fas fa-circle-info me-1"></i>About
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Global Modal ── -->
<div class="kiro-modal-overlay" id="kiroModalOverlay">
  <div class="kiro-modal" role="dialog" aria-modal="true">
    <div class="kiro-modal-header">
      <div class="kiro-modal-icon" id="kiroModalIcon">
        <i class="fas fa-triangle-exclamation" id="kiroModalIconEl"></i>
      </div>
      <div>
        <p class="kiro-modal-title" id="kiroModalTitle">Notice</p>
        <p class="text-muted small mb-0" id="kiroModalSubtitle"></p>
      </div>
    </div>
    <div class="kiro-modal-body" id="kiroModalBody"></div>
    <div class="kiro-modal-footer">
      <button class="btn btn-outline-secondary btn-sm" id="kiroModalCancel"
              onclick="closeKiroModal()" style="display:none;">Cancel</button>
      <button class="btn btn-primary btn-sm" id="kiroModalOk"
              onclick="closeKiroModal()">OK</button>
    </div>
  </div>
</div>

{% block content %}{% endblock %}

<footer>
  <div class="container text-center">
    <p class="mb-0">
      &copy; 2026 <strong>MUHORAKEYE MARTHA</strong>. All rights reserved.
    </p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ── Global Modal JS ── -->
<script>
/**
 * showModal(options)
 * options: {
 *   type:     'warning' | 'danger' | 'success' | 'info'  (default: 'warning')
 *   title:    string
 *   subtitle: string (optional)
 *   body:     string  (HTML allowed)
 *   items:    string[] (optional bullet list)
 *   okText:   string  (default: 'OK')
 *   onOk:     function (optional callback)
 * }
 */
function showModal(opts) {
  const icons = {
    warning: { cls: 'warning', icon: 'fa-triangle-exclamation' },
    danger:  { cls: 'danger',  icon: 'fa-circle-xmark'         },
    success: { cls: 'success', icon: 'fa-circle-check'         },
    info:    { cls: 'info',    icon: 'fa-circle-info'          },
  };
  const t = icons[opts.type || 'warning'];

  document.getElementById('kiroModalIcon').className    = 'kiro-modal-icon ' + t.cls;
  document.getElementById('kiroModalIconEl').className  = 'fas ' + t.icon;
  document.getElementById('kiroModalTitle').textContent = opts.title    || 'Notice';
  document.getElementById('kiroModalSubtitle').textContent = opts.subtitle || '';

  let bodyHtml = opts.body ? `<p class="mb-0">${opts.body}</p>` : '';
  if (opts.items && opts.items.length) {
    bodyHtml += '<ul class="kiro-modal-list mt-2">' +
      opts.items.map(i => `<li>${escapeModalItem(i)}</li>`).join('') + '</ul>';
  }
  document.getElementById('kiroModalBody').innerHTML = bodyHtml;

  const okBtn = document.getElementById('kiroModalOk');
  okBtn.textContent = opts.okText || 'OK';
  okBtn.className   = 'btn btn-sm ' +
    (opts.type === 'danger' ? 'btn-danger' :
     opts.type === 'success' ? 'btn-success' : 'btn-primary');

  // Store callback
  okBtn._onOk = opts.onOk || null;

  document.getElementById('kiroModalOverlay').classList.add('show');
  okBtn.focus();
}

function escapeModalItem(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

function closeKiroModal() {
  const overlay = document.getElementById('kiroModalOverlay');
  overlay.classList.remove('show');
  const cb = document.getElementById('kiroModalOk')._onOk;
  if (cb) cb();
}

// Close on overlay click
document.getElementById('kiroModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeKiroModal();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeKiroModal();
});

{% if kiro_modal %}
document.addEventListener('DOMContentLoaded', function() {
  showModal({{ kiro_modal | tojson }});
});
{% endif %}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
